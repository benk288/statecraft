<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statecraft — Sports Betting Legislative Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Provisional design tokens (no DESIGN.md yet): 4px base, 8px rhythm */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1a1a1a; --muted: #6b6b66; --line: #e2e0d8; --line-soft: #efede6;
    --accent: #1f3a5f; --accent-soft: #e4ebf4; --hover: #ffd84d; --hover-ink: #5c4a00;
    --map-0: #efeee8; --map-1: #d9e4f0; --map-2: #a9c3dd; --map-3: #6f98c2; --map-4: #2f5f93;
    --ok: #2a7f4f; --warn: #b55a00; --bad: #a12b2b; --law: #4b3d8f;
    --radius: 8px; --font: Inter, system-ui, -apple-system, sans-serif; --serif: "Source Serif 4", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--font); color: var(--ink); background: var(--bg); display: grid; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden; font-size: 14px; }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; }

  /* ---- top bar ---- */
  header { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--s5); padding: var(--s3) var(--s5); border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { display: flex; align-items: baseline; gap: var(--s3); }
  .brand h1 { font-family: var(--serif); font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .brand .topic { font-size: 13px; color: var(--muted); }
  nav.views { display: flex; gap: var(--s1); justify-self: center; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  nav.views button { border: 0; background: none; padding: 6px 14px; border-radius: 7px; font-size: 13px; color: var(--muted); font-weight: 500; }
  nav.views button.on { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  nav.views button .n { display: inline-block; min-width: 18px; margin-left: 6px; padding: 0 5px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700; text-align: center; }
  .meta { font-size: 11.5px; color: var(--muted); text-align: right; line-height: 1.45; }
  .meta b { color: var(--ink); font-weight: 600; }

  /* ---- three-pane workspace ---- */
  main { display: grid; grid-template-columns: minmax(380px, 1.1fr) 400px minmax(440px, 1.3fr); min-height: 0; }
  main.no-map { grid-template-columns: 440px minmax(0, 1fr); }
  main.no-map #map-pane { display: none; }
  #map-pane { position: relative; min-height: 0; border-right: 1px solid var(--line); }
  #map { width: 100%; height: 100%; display: block; }
  #map .state { stroke: #fff; stroke-width: .8; cursor: pointer; transition: fill .12s; }
  #map .state:hover { fill: var(--hover) !important; stroke: var(--hover-ink); stroke-width: 1.2; }
  #map .state.selected { stroke: var(--ink); stroke-width: 1.8; }
  .overlay { position: absolute; background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s2) var(--s3); font-size: 12px; color: var(--muted); }
  #lens { left: var(--s4); top: var(--s4); display: flex; flex-direction: column; gap: 6px; }
  #lens label, #legend b { font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: 10.5px; color: var(--muted); }
  #lens select { font: inherit; font-size: 13px; color: var(--ink); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); min-width: 210px; }
  #legend { left: var(--s4); bottom: var(--s4); }
  #legend .lrow { display: flex; align-items: center; gap: var(--s2); margin-top: 5px; }
  #legend .sw { width: 13px; height: 13px; border-radius: 3px; border: 1px solid rgba(0,0,0,.08); }
  #tip { position: absolute; pointer-events: none; display: none; z-index: 5; background: var(--ink); color: #fff; padding: var(--s2) var(--s3); border-radius: var(--radius); font-size: 12.5px; line-height: 1.45; box-shadow: 0 6px 20px rgba(0,0,0,.18); max-width: 260px; }
  #tip .name { font-weight: 600; font-size: 14px; margin-bottom: 3px; }
  #tip .sub { color: #cfcfcf; }
  #tip .hint { color: var(--hover); margin-top: 5px; font-size: 11.5px; }

  /* ---- list pane ---- */
  #list-pane { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
  .pane-head { padding: var(--s4) var(--s4) var(--s3); border-bottom: 1px solid var(--line); }
  .pane-head h2 { font-family: var(--serif); font-size: 20px; margin: 0 0 2px; }
  .pane-head .sub { font-size: 12.5px; color: var(--muted); }
  .pane-head .back { font-size: 12.5px; color: var(--accent); background: none; border: 0; padding: 0; margin-bottom: 6px; }
  .pane-head .back:hover { text-decoration: underline; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); margin-top: var(--s3); }
  .stat { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s2) var(--s3); }
  .stat .n { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .stat .l { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 1px; }
  .controls { display: flex; gap: var(--s2); padding: var(--s2) var(--s4); border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
  .tabs { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 2px; }
  .tabs button { border: 0; background: none; padding: 5px 10px; border-radius: 5px; font-size: 12.5px; color: var(--muted); }
  .tabs button.on { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .controls input[type=search] { flex: 1; min-width: 110px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px; font: inherit; font-size: 12.5px; background: var(--bg); }
  .controls label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .list { overflow-y: auto; flex: 1; }
  .section-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: var(--s3) var(--s4) var(--s1); font-weight: 600; position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .row { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line-soft); padding: var(--s3) var(--s4); border-left: 3px solid transparent; }
  .row:hover { background: #fbfaf6; }
  .row.on { background: var(--accent-soft); border-left-color: var(--accent); }
  .row.moved { border-left-color: var(--hover); }
  .row.on.moved { border-left-color: var(--accent); }
  .row .top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .row .num { font-weight: 700; font-size: 13.5px; }
  .row .title { font-size: 13px; line-height: 1.35; margin-top: 4px; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .action { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .row .pos-dots { display: inline-flex; gap: 3px; margin-left: auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.oppose { background: var(--bad); } .dot.support { background: var(--ok); } .dot.monitor { background: var(--muted); } .dot.amend { background: var(--warn); }
  .state-tag { display: inline-block; font-size: 10.5px; font-weight: 700; background: var(--ink); color: #fff; padding: 1px 5px; border-radius: 4px; }
  .badge { font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
  .badge.s0, .badge.s1 { background: var(--accent-soft); color: var(--accent); }
  .badge.s2, .badge.s3 { background: #fff1e0; color: var(--warn); }
  .badge.s4 { background: #e9e4f7; color: var(--law); }
  .badge.s5, .badge.s6 { background: #f8e3e3; color: var(--bad); }
  .badge.mv2 { background: #fff7cc; color: var(--hover-ink); border-color: #f0dc8a; }
  .badge.mv3 { background: #ffe8b3; color: #7a4a00; border-color: #f0c870; }
  .badge.ai { background: #e8f3ee; color: var(--ok); }
  .empty { padding: var(--s5) var(--s4); color: var(--muted); font-size: 13px; line-height: 1.5; }
  .notice { font-size: 11.5px; color: var(--muted); padding: var(--s2) var(--s4); border-top: 1px solid var(--line); line-height: 1.45; background: var(--bg); }

  /* ---- detail pane ---- */
  #detail-pane { overflow-y: auto; min-height: 0; background: var(--bg); }
  .detail { padding: var(--s5) var(--s6) var(--s6); max-width: 820px; }
  .detail .crumbs { font-size: 12px; color: var(--muted); display: flex; gap: var(--s2); align-items: center; margin-bottom: var(--s3); }
  .detail h2 { font-family: var(--serif); font-size: 26px; margin: 0 0 var(--s2); line-height: 1.2; }
  .detail .titleline { font-size: 15px; line-height: 1.45; color: var(--ink); margin-bottom: var(--s3); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: var(--s4); }
  .tag { font-size: 11px; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 4px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: var(--s4) var(--s5); margin-bottom: var(--s3); }
  .card h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 var(--s2); font-weight: 600; display: flex; align-items: center; gap: var(--s2); }
  .card p { margin: 0 0 var(--s2); line-height: 1.55; font-size: 14px; }
  .card p:last-child { margin-bottom: 0; }
  .card ul { margin: 0; padding-left: 18px; line-height: 1.55; }
  .card li { margin-bottom: 4px; }
  .card .meta-row { display: grid; grid-template-columns: 140px 1fr; gap: 6px var(--s3); font-size: 13px; }
  .card .meta-row dt { color: var(--muted); } .card .meta-row dd { margin: 0; }
  .card.ai { border-left: 3px solid var(--ok); }
  .card.watch { background: #fffbe8; border-color: #f0dc8a; }
  .links { display: flex; gap: var(--s4); flex-wrap: wrap; font-size: 13px; }
  .links a { text-decoration: none; } .links a:hover { text-decoration: underline; }
  .sponsor { display: grid; grid-template-columns: 1fr auto; gap: var(--s3); align-items: start; }
  .sponsor .name { font-weight: 600; font-size: 15px; }
  .sponsor .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .sponsor .nums { display: flex; gap: var(--s4); }
  .sponsor .nums div { text-align: center; } .sponsor .nums .n { font-size: 20px; font-weight: 700; } .sponsor .nums .l { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .positions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .pos { font-size: 12.5px; padding: 4px 9px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); display: inline-flex; gap: 6px; align-items: center; }
  .pos.oppose { border-color: #e3b4b4; background: #fbeaea; } .pos.support { border-color: #b4d6c1; background: #e8f5ec; } .pos.amend { border-color: #e7cf9a; background: #fff6e0; }
  .pos .x { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 0; line-height: 1; }
  .btn { font-size: 12.5px; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.dashed { border-style: dashed; }
  .posform { display: flex; gap: 6px; margin-top: var(--s2); flex-wrap: wrap; }
  .posform[hidden] { display: none; }
  .posform input, .posform select, textarea { font: inherit; font-size: 13px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; }
  .posform input[name=who] { width: 170px; } .posform input[name=note] { flex: 1; min-width: 140px; }
  .hist { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); line-height: 1.55; }
  .hist b { color: var(--ink); font-weight: 500; }
  textarea { width: 100%; min-height: 220px; resize: vertical; line-height: 1.5; }
  .cmp-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); margin-bottom: var(--s3); }
  .cmp-list li { margin-bottom: 6px; font-size: 13px; line-height: 1.45; }
  .cmp-list .q { color: var(--muted); font-size: 12px; }
  .cmp-list.missing li::marker { color: var(--bad); } .cmp-list.covered li::marker { color: var(--ok); } .cmp-list.added li::marker { color: var(--warn); }
  .kbd { font-family: ui-monospace, Menlo, monospace; font-size: 11px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--muted); }
  .brief { padding: var(--s5) var(--s6); max-width: 820px; }
  .brief h2 { font-family: var(--serif); font-size: 26px; margin: 0 0 var(--s1); }
  .brief .date { color: var(--muted); margin-bottom: var(--s4); }
  .brief h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: var(--s5) 0 var(--s2); }
  .brief .item { padding: var(--s2) 0; border-bottom: 1px solid var(--line); font-size: 13.5px; line-height: 1.5; }
  .brief .item b { font-weight: 600; }
  @media print {
    header, #map-pane, #list-pane { display: none !important; }
    body { overflow: visible; height: auto; display: block; background: #fff; }
    main { display: block; }
    #detail-pane { overflow: visible; background: #fff; }
    .btn, .posform { display: none !important; }
  }
  @media (max-width: 1100px) {
    main { grid-template-columns: 360px minmax(0, 1fr); }
    #map-pane { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Statecraft</h1><span class="topic" id="topic">Sports betting · legislative radar</span></div>
  <nav class="views" id="views"></nav>
  <div class="meta" id="meta"></div>
</header>
<main id="main">
  <div id="map-pane">
    <svg id="map" role="img" aria-label="Map of US states shaded by number of active sports betting bills"></svg>
    <div id="lens" class="overlay"></div>
    <div id="legend" class="overlay"></div>
    <div id="tip"></div>
  </div>
  <section id="list-pane" aria-label="Bill list"></section>
  <section id="detail-pane" aria-label="Bill detail"></section>
</main>
<script src="vendor/d3.v7.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="vendor/states-10m.js"></script>
<script src="data/bills.js"></script>
<script src="data/analysis.js"></script>
<script src="data/sponsors.js"></script>
<script src="data/texts.js"></script>
<script src="app.js"></script>
</body>
</html>
