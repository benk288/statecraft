<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statecraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #f6f1e7; --paper: #fffaf0; --ink: #111111; --ink-2: #3a332d; --muted: #5a5048; --faint: #8a8072;
    --rule: #111111; --rule-soft: #d8cfbd; --rule-faint: #e6dccb; --line-input: #c9bfab; --wash: #efe6d6; --wash-2: #f3ebdc; --select: #fbefe3;
    --red: #a3271a; --red-soft: #f0c9b5; --green: #2a6b45; --amber: #b35c00;
    --map-0: #e9e2d4; --map-1: #f0c9b5; --map-2: #e29274; --map-3: #c4472d; --map-4: #7f1d12;
    --serif: Fraunces, Georgia, serif; --sans: "IBM Plex Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 14px; }
  a { color: var(--ink); } a:hover { color: var(--red); }
  button, select, input, textarea { font: inherit; color: inherit; }
  button, select { cursor: pointer; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; }
  .serif { font-family: var(--serif); }
  .kicker { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--red); }
  .kicker.muted { color: var(--muted); }
  .muted { color: var(--muted); }

  /* header */
  header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 28px; padding: 14px 32px; border-bottom: 1px solid var(--rule); }
  .brand { font-family: var(--serif); font-weight: 800; font-size: 22px; letter-spacing: -0.01em; }
  nav.main { display: flex; gap: 22px; font-weight: 600; }
  nav.main a { text-decoration: none; padding-bottom: 3px; border-bottom: 2px solid transparent; }
  nav.main a.on { color: var(--red); border-bottom-color: var(--red); }
  .spacer { flex: 1; }
  .session { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .session select { border: 1px solid var(--rule); background: var(--paper); padding: 7px 10px; font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-input); background: var(--paper); height: 36px; padding: 0 12px; width: 280px; color: var(--muted); }
  .search input { flex: 1; border: 0; background: none; outline: none; min-width: 0; }
  nav.topics { display: flex; flex-wrap: wrap; gap: 28px; padding: 0 32px; border-bottom: 1px solid var(--rule-soft); }
  nav.topics a { text-decoration: none; padding: 12px 0; border-bottom: 2px solid transparent; }
  nav.topics a.on { color: var(--red); font-weight: 600; border-bottom-color: var(--red); }
  nav.topics a span { color: var(--muted); font-weight: 400; }
  .meta { font-size: 11.5px; color: var(--muted); text-align: right; line-height: 1.4; }

  /* buttons and chips */
  .chip { border: 1px solid var(--line-input); background: var(--paper); color: var(--ink); padding: 5px 11px; font-size: 12.5px; }
  .chip.on { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .btn { border: 1px solid var(--rule); background: none; padding: 9px 14px; font-weight: 600; text-decoration: none; color: var(--ink); display: inline-block; }
  .btn.solid { background: var(--ink); color: var(--ground); }
  .btn.red { background: var(--red); color: #fff; border-color: var(--red); }
  .btn.dashed { border: 1px dashed var(--red); color: var(--red); font-weight: 400; }
  .btn.sm { padding: 6px 10px; font-size: 13px; }
  .btn.ghost { border: 0; padding: 0; color: var(--red); font-weight: 600; }
  .tag { border: 1px solid var(--rule); padding: 3px 9px; font-size: 12.5px; display: inline-block; }
  .stance { font-size: 12px; font-weight: 600; padding: 2px 8px; display: inline-block; }
  .stance.support { background: var(--green); color: #fff; } .stance.oppose { background: var(--red); color: #fff; }
  .stance.amend { background: var(--amber); color: #fff; } .stance.watch { background: var(--rule-faint); color: var(--ink); }
  .seg { display: flex; border: 1px solid var(--rule); }
  .seg button { flex: 1; border: 0; border-right: 1px solid var(--rule); background: #fff; padding: 9px 0; font-size: 13px; }
  .seg button:last-child { border-right: 0; } .seg button.on { background: var(--ink); color: var(--ground); }
  .seg.sm button { padding: 6px 10px; font-size: 12.5px; flex: none; }
  .input { border: 1px solid var(--line-input); background: #fff; padding: 9px 10px; width: 100%; }
  textarea.input { font-family: var(--serif); font-size: 16px; line-height: 1.5; min-height: 76px; resize: vertical; background: var(--paper); padding: 12px; }
  .card { background: var(--paper); border: 1px solid var(--rule); padding: 18px; }
  .rule-top { border-top: 1px solid var(--rule); padding-top: 12px; }
  .double { border-bottom: 3px double var(--rule); }

  /* map screen */
  main.map { display: flex; flex-wrap: wrap; gap: 32px; padding: 24px 32px 32px; }
  .map-col { flex: 999 1 620px; min-width: 0; }
  .issues { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .issues .kicker { margin-right: 6px; }
  #map-wrap { position: relative; margin-top: 16px; }
  #map { width: 100%; height: auto; display: block; }
  #map .state { stroke: var(--ground); stroke-width: 1; cursor: pointer; transition: fill .12s; }
  #map .state:hover { stroke: var(--ink); stroke-width: 1.5; }
  #map .state.selected { stroke: var(--ink); stroke-width: 2.2; }
  #map .state.infolder { stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: 3 2; }
  #tip { position: absolute; pointer-events: none; display: none; z-index: 5; background: var(--ink); color: var(--ground); padding: 14px 16px; width: 230px; font-size: 13px; line-height: 1.5; }
  #tip .name { font-family: var(--serif); font-size: 21px; font-weight: 600; }
  #tip .soft { color: var(--red-soft); }
  #tip .hint { margin-top: 8px; border-top: 1px solid #3a332d; padding-top: 8px; color: var(--red-soft); }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend b { margin-right: 8px; color: var(--ink); }
  .legend .sw { width: 40px; height: 10px; display: inline-block; }
  .legend label { display: flex; gap: 6px; align-items: center; }
  .list-col { flex: 1 1 400px; display: flex; flex-direction: column; border-left: 1px solid var(--rule-soft); padding-left: 28px; position: relative; min-height: 600px; }
  .list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .list-head h2 { font-size: 24px; }
  .list-head select { border: 0; background: none; font-size: 13px; color: var(--muted); }
  .rows { flex: 1; overflow-y: auto; max-height: calc(100vh - 290px); padding-bottom: 72px; }
  .brow { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--rule-soft); }
  .brow.on { background: var(--select); }
  .brow input[type=checkbox] { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--red); flex: none; }
  .brow a.body { flex: 1; text-decoration: none; min-width: 0; }
  .brow .where { display: flex; justify-content: space-between; font-size: 12px; } .brow .where b { color: var(--red); } .brow .where span { color: var(--muted); }
  .brow .t { font-family: var(--serif); font-size: 18px; line-height: 1.25; font-weight: 600; margin-top: 3px; }
  .brow .stage { font-size: 12.5px; color: var(--muted); margin-top: 4px; } .brow .stage i { font-style: normal; color: var(--ink); }
  .bulk { position: absolute; left: 28px; right: 0; bottom: 0; background: var(--ink); color: var(--ground); padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .bulk b { font-size: 13.5px; }
  .bulk .btn { color: var(--ground); border-color: var(--ground); padding: 7px 12px; font-size: 13px; font-weight: 400; }
  .bulk .btn.solid { background: var(--ground); color: var(--ink); font-weight: 600; }
  .popover { position: absolute; right: 0; bottom: 64px; width: 300px; background: var(--paper); border: 1px solid var(--rule); box-shadow: 6px 6px 0 var(--ink); padding: 14px; z-index: 6; }
  .popover h3 { font-size: 18px; margin-bottom: 8px; }
  .popover label { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule-faint); font-size: 13.5px; }
  .popover label input { accent-color: var(--red); }
  .popover label span small { display: block; font-size: 12px; color: var(--muted); }
  .empty { padding: 28px 0; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
  .newcount { font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--red); margin-left: 8px; vertical-align: middle; }
  .newdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-right: 6px; vertical-align: middle; }

  /* bill screen */
  .crumbs { padding: 14px 32px; font-size: 13px; color: var(--muted); display: flex; gap: 8px; }
  .crumbs a { color: var(--muted); } .crumbs .here { color: var(--ink); }
  main.bill { display: flex; flex-wrap: wrap; gap: 40px; padding: 4px 32px 48px; }
  .bill-main { flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
  .bill-main h1 { font-size: 42px; line-height: 1.08; margin: 8px 0 10px; }
  .bill-main .lede { font-size: 17px; line-height: 1.55; color: var(--ink-2); max-width: 720px; }
  .bill-links { display: flex; gap: 18px; margin-top: 12px; font-size: 13.5px; flex-wrap: wrap; } .bill-links a { color: var(--red); }
  ol.progress { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 3px double var(--rule); border-bottom: 1px solid var(--rule); }
  ol.progress li { padding: 12px 12px 12px 0; border-right: 1px solid var(--rule-soft); } ol.progress li:last-child { border-right: 0; }
  ol.progress .i { font-family: var(--serif); font-size: 22px; font-weight: 800; }
  ol.progress .l { font-size: 13px; font-weight: 600; } ol.progress .d { font-size: 12px; color: var(--muted); }
  ol.progress .done .i { color: var(--red); } ol.progress .todo .i { color: var(--line-input); } ol.progress .todo .l { color: var(--faint); }
  .tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--rule-soft); }
  .tabs button, .tabs a { border: 0; background: none; padding: 10px 0; color: var(--muted); text-decoration: none; margin-bottom: -1px; border-bottom: 2px solid transparent; }
  .tabs .on { font-weight: 600; color: var(--red); border-bottom-color: var(--red); }
  .prose { max-width: 720px; display: flex; flex-direction: column; gap: 12px; }
  .prose .note { font-size: 12px; color: var(--muted); font-style: italic; }
  .prose .big { font-family: var(--serif); font-size: 20px; line-height: 1.5; }
  .prose ul { margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.65; }
  .prose pre { white-space: pre-wrap; font: 13.5px/1.6 var(--sans); max-height: 70vh; overflow: auto; background: var(--paper); border: 1px solid var(--rule-soft); padding: 16px; }
  .hist { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.7; } .hist b { font-weight: 600; }
  .bill-side { flex: 1 1 380px; display: flex; flex-direction: column; gap: 22px; }
  .bill-side h2 { font-size: 22px; }
  .posrow { padding: 12px 0; border-bottom: 1px solid var(--rule-faint); }
  .posrow .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .posrow .hd a { font-weight: 600; text-decoration: none; }
  .posrow .note { font-size: 13px; color: var(--ink-2); margin-top: 4px; } .posrow .by { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .posrow .x { border: 0; background: none; color: var(--muted); padding: 0 4px; }
  .addpos { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .addpos .kicker { font-size: 12px; letter-spacing: .1em; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border: 1px solid var(--rule); padding: 6px 10px; font-size: 13px; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
  .pill button { border: 0; background: none; padding: 0; color: var(--muted); }
  .doc { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule-soft); text-decoration: none; }
  .doc .ext { width: 34px; height: 40px; flex: none; border: 1px solid var(--rule); display: flex; align-items: flex-end; justify-content: center; font-size: 9.5px; font-weight: 600; padding-bottom: 4px; background: var(--paper); }
  .doc .nm { font-weight: 600; font-size: 13.5px; display: block; } .doc .mt { font-size: 12px; color: var(--muted); }
  .dropzone { margin-top: 12px; border: 1px dashed #a39a88; padding: 14px; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
  .dropzone .row { display: flex; gap: 8px; } .dropzone .row input { flex: 1; }

  /* two-column screens (folders, clients) */
  .split { display: flex; flex-wrap: wrap; }
  .sidenav { flex: 1 1 280px; max-width: 320px; padding: 24px 24px 24px 32px; border-right: 1px solid var(--rule-soft); display: flex; flex-direction: column; gap: 18px; min-height: calc(100vh - 60px); }
  .sidenav .group .kicker { font-size: 11.5px; margin-bottom: 4px; }
  .sidenav .item { display: flex; justify-content: space-between; padding: 7px 10px; margin: 0 -10px; text-decoration: none; }
  .sidenav .item.on { background: #ecdfca; font-weight: 600; } .sidenav .item span:last-child { color: var(--muted); font-weight: 400; }
  .sidenav .client { display: block; padding: 14px; text-decoration: none; border: 1px solid var(--rule-soft); }
  .sidenav .client.on { background: var(--paper); border-color: var(--rule); }
  .sidenav .client .nm { font-family: var(--serif); font-size: 18px; font-weight: 600; } .sidenav .client .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; } .sidenav .client .ct { font-size: 12.5px; margin-top: 6px; }
  .content { flex: 999 1 640px; min-width: 0; padding: 24px 32px 48px; display: flex; flex-direction: column; gap: 22px; }
  .titlebar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: flex-end; padding-bottom: 16px; }
  .titlebar h1 { font-size: 40px; line-height: 1.1; margin: 6px 0 4px; }
  .titlebar > div:first-child { flex: 1 1 420px; min-width: 0; }
  .titlebar h1 input { font: inherit; border: 0; border-bottom: 1px dashed var(--line-input); background: none; width: 100%; }
  .titlebar .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .tally { display: flex; border: 1px solid var(--rule); }
  .tally div { padding: 10px 18px; border-right: 1px solid var(--rule-soft); text-align: center; } .tally div:last-child { border-right: 0; }
  .tally .n { font-family: var(--serif); font-size: 28px; font-weight: 800; } .tally .l { font-size: 12px; color: var(--muted); }
  .fstate h2 { font-size: 24px; } .fstate .hd { display: flex; align-items: baseline; gap: 12px; }
  .frow { display: grid; grid-template-columns: 90px minmax(0, 1fr) 150px 110px 150px; gap: 16px; align-items: center; padding: 12px 0; font-size: 14px; }
  .frow .num { font-weight: 600; color: var(--red); } .frow .t { text-decoration: none; font-family: var(--serif); font-size: 17px; font-weight: 600; }
  .docs-row .rm { border: 0; background: none; color: var(--muted); font-size: 12.5px; padding: 0; text-decoration: underline; }
  .docs-row { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 6px; }
  .docs-row a { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-input); background: var(--paper); padding: 6px 10px; text-decoration: none; font-size: 13px; }
  .docs-row a b { font-size: 10px; border: 1px solid var(--rule); padding: 1px 4px; }
  table.grid { width: 100%; border-collapse: collapse; min-width: 820px; }
  table.grid th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--rule); }
  table.grid td { padding: 14px 12px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
  table.grid th:first-child, table.grid td:first-child { padding-left: 0; } table.grid th:last-child, table.grid td:last-child { padding-right: 0; }
  table.grid .num { font-weight: 600; color: var(--red); text-decoration: none; } table.grid .t { font-family: var(--serif); font-size: 16px; font-weight: 600; margin-top: 2px; }
  table.grid select.stance { border: 0; padding: 4px 8px; }
  .scrollx { overflow-x: auto; }
  .todo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--rule-faint); }
  .todo-row .num { width: 130px; font-weight: 600; color: var(--red); text-decoration: none; }
  .todo-row .t { flex: 1; min-width: 200px; font-family: var(--serif); font-size: 16px; font-weight: 600; }
  .todo-row .stage { width: 130px; font-size: 13px; color: var(--muted); }

  /* compare */
  main.compare { padding: 24px 32px 48px; display: flex; flex-direction: column; gap: 20px; }
  .cmp-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .cmp-bar .sel { border: 1px solid var(--rule); background: var(--paper); padding: 7px 12px; font-weight: 600; }
  .cmp-bar .sel button { border: 0; background: none; padding: 0 0 0 6px; }
  .cmp-bar label { display: flex; align-items: center; gap: 8px; font-size: 13.5px; } .cmp-bar input[type=checkbox] { accent-color: var(--red); }
  table.cmp { width: 100%; border-collapse: collapse; min-width: 980px; }
  table.cmp thead th { text-align: left; vertical-align: bottom; padding: 0 16px 14px; border-bottom: 3px double var(--rule); font-weight: 400; }
  table.cmp thead th:first-child { width: 200px; padding-left: 0; }
  table.cmp thead th.model { background: var(--wash); }
  table.cmp thead a, table.cmp thead .nm { display: block; font-family: var(--serif); font-size: 22px; font-weight: 600; line-height: 1.2; text-decoration: none; margin-top: 4px; }
  table.cmp tbody th { text-align: left; padding: 14px 16px 14px 0; border-bottom: 1px solid var(--rule-soft); font-size: 13px; font-weight: 600; vertical-align: top; }
  table.cmp td { padding: 14px 16px; border-bottom: 1px solid var(--rule-soft); font-size: 14.5px; line-height: 1.5; vertical-align: top; }
  table.cmp td.na { color: #6e6558; } table.cmp td.model { background: var(--wash-2); color: var(--muted); font-size: 14px; }
  table.cmp td ul { margin: 0; padding-left: 18px; }
  .picker { position: relative; }
  .picker .menu { position: absolute; top: 100%; left: 0; z-index: 7; width: 360px; max-height: 320px; overflow: auto; background: var(--paper); border: 1px solid var(--rule); box-shadow: 6px 6px 0 var(--ink); }
  .picker .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; border-bottom: 1px solid var(--rule-faint); }
  .picker .menu button:hover { background: var(--select); }
  .hdr-icons { display: flex; gap: 6px; }
  .icon { width: 34px; height: 34px; border: 1px solid var(--rule); background: var(--paper); font-size: 15px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .icon:hover { background: var(--ink); color: var(--ground); }
  .sheet { position: fixed; inset: 0; background: rgba(17,17,17,.35); z-index: 20; display: flex; justify-content: flex-end; }
  .sheet-in { width: min(460px, 100%); background: var(--ground); border-left: 1px solid var(--rule); padding: 24px 28px; overflow-y: auto; }
  .sheet-in .list-head h2 { font-size: 24px; }
  .sheet-in label { display: flex; flex-direction: column; gap: 4px; }
  @media print {
    header.top, nav.topics, .sidenav, .titlebar .actions, .docs-row .btn, .docs-row .rm, #sharebox, .search { display: none !important; }
    body { background: #fff; } .content { padding: 0; } textarea.input { border: 0; padding: 0; background: none; }
    .frow { grid-template-columns: 90px 1fr 140px 100px 130px; }
  }
  @media (max-width: 900px) { .frow { grid-template-columns: 1fr; gap: 4px; } .list-col { border-left: 0; padding-left: 0; } .rows { max-height: none; } }
</style>
</head>
<body>
<div id="app"></div>
<datalist id="stakeholders"></datalist>
<script src="vendor/d3.v7.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="vendor/states-10m.js"></script>
<script>
  for (const f of ["data/bills.js", "data/analysis.js", "data/sponsors.js", "data/headlines.js", "app.js"]) document.write(`<script src="${f}?v=${Date.now()}"><\/script>`);
</script>
</body>
</html>
